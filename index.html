<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRIDEクイズチャレンジ</title>
  <style>
    :root {
      --r1: #e40303;
      --r2: #ff8c00;
      --r3: #ffed00;
      --r4: #008026;
      --r5: #004dff;
      --r6: #750787;
      --ink: #1f2430;
      --sub: #5a6273;
      --card: #ffffff;
      --line: #d8e0ea;
      --ok-bg: #e8fff4;
      --ok-bd: #90e8bf;
      --ok-tx: #0b6b41;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "BIZ UDPGothic", "Yu Gothic UI", sans-serif;
      background:
        linear-gradient(145deg, #fff9f9, #f5f8ff),
        repeating-linear-gradient(
          90deg,
          rgba(228, 3, 3, 0.08) 0, rgba(228, 3, 3, 0.08) 30px,
          rgba(255, 140, 0, 0.08) 30px, rgba(255, 140, 0, 0.08) 60px,
          rgba(255, 237, 0, 0.08) 60px, rgba(255, 237, 0, 0.08) 90px,
          rgba(0, 128, 38, 0.08) 90px, rgba(0, 128, 38, 0.08) 120px,
          rgba(0, 77, 255, 0.08) 120px, rgba(0, 77, 255, 0.08) 150px,
          rgba(117, 7, 135, 0.08) 150px, rgba(117, 7, 135, 0.08) 180px
        );
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
    }

    .app {
      width: min(960px, 100%);
      background:
        linear-gradient(to bottom, var(--r1), var(--r2), var(--r3), var(--r4), var(--r5), var(--r6))
        left / 6px 100% no-repeat,
        var(--card);
      border-radius: 20px;
      border: 1px solid #eff3f8;
      box-shadow: 0 18px 44px rgba(15, 23, 42, 0.12);
      max-height: calc(100vh - 40px);
      overflow-y: auto;
    }

    .top {
      position: sticky;
      top: 0;
      z-index: 5;
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(to right, var(--r1), var(--r2), var(--r3), var(--r4), var(--r5), var(--r6))
        top / 100% 5px no-repeat,
        linear-gradient(to bottom, var(--r1), var(--r2), var(--r3), var(--r4), var(--r5), var(--r6))
        left / 6px 100% no-repeat,
        linear-gradient(#eef7ff, #eef7ff);
    }

    .top-intro {
      padding: 12px 14px;
    }

    .title {
      margin: 0;
      font-size: clamp(1.2rem, 2.8vw, 1.8rem);
      letter-spacing: 0.03em;
    }

    .sub {
      margin: 8px 0 0;
      color: var(--sub);
      font-size: 0.95rem;
      line-height: 1.6;
    }



    .rules-card {
      text-align: left;
      background: #fbfcfe;
      border: 1px solid #dfe7ef;
      border-radius: 12px;
      padding: 12px 14px;
      max-width: 560px;
      margin: 0 auto 18px;
    }

    .rules-card h2 {
      margin: 0 0 8px;
      font-size: 0.86rem;
      color: #3a5568;
    }

    .rules-list {
      margin: 0;
      padding-left: 1.2rem;
      color: #2c4257;
      line-height: 1.5;
      font-size: 0.93rem;
      display: grid;
      gap: 4px;
    }

    .difficulty-section {
      margin: 14px 0 6px;
      text-align: left;
      padding-left: 14px;
    }

    .difficulty-title {
      margin: 0 0 9px;
      padding: 7px 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 1.08rem;
      font-weight: 700;
      color: #0f405b;
      background: #e9f4ff;
      border: 1px solid #c6ddf0;
      border-radius: 999px;
    }

    .difficulty-title::before {
      content: "";
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: linear-gradient(to bottom, var(--r1), var(--r6));
      box-shadow: 0 0 0 2px #e5f0fb;
      flex-shrink: 0;
    }

    .difficulty-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      align-items: stretch;
    }

    .difficulty-option {
      position: relative;
      display: block;
      cursor: pointer;
    }

    .difficulty-radio {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .difficulty-copy {
      display: block;
      height: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      padding: 14px 13px;
      box-shadow: 0 6px 12px rgba(15, 23, 42, 0.03);
      transition: transform 0.08s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .difficulty-option:hover .difficulty-copy {
      transform: translateY(-1px);
      border-color: #a9cde0;
      box-shadow: 0 8px 14px rgba(15, 23, 42, 0.05);
    }

    .difficulty-radio:checked + .difficulty-copy {
      border-color: #7aa7bf;
      background: linear-gradient(180deg, #f8fdff, #eef7fc);
      box-shadow: 0 12px 22px rgba(0, 77, 255, 0.08);
    }

    .difficulty-name {
      display: block;
      margin-bottom: 6px;
      font-size: 1.08rem;
      font-weight: 700;
      color: #17354a;
    }

    .difficulty-desc {
      display: block;
      color: var(--sub);
      line-height: 1.55;
      font-size: 0.89rem;
    }

    .difficulty-status {
      margin: 0;
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      background: #edf6ff;
      color: #214a63;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      white-space: nowrap;
      text-align: left;
      flex-shrink: 0;
    }

    .panel { padding: 18px 20px 22px; }

    #startScreen {
      max-width: 820px;
      margin: 0 auto;
      padding: 24px 34px 12px;
    }
    .meta {
      margin-bottom: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .progress-card {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }

    .progress-label {
      font-size: 0.9rem;
      font-weight: 700;
      color: #385269;
      white-space: nowrap;
      min-width: 56px;
      text-align: right;
      margin: 0;
    }

    .progress {
      flex: 1;
      background: #e8eff6;
      border-radius: 999px;
      height: 16px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(to right, var(--r1), var(--r2), var(--r3), var(--r4), var(--r5), var(--r6));
      transition: width 0.25s ease;
    }

    .question {
      margin: 0 0 14px;
      line-height: 1.5;
      font-size: clamp(1rem, 2.5vw, 1.2rem);
    }

    .choices {
      display: grid;
      gap: 10px;
    }

    .choice {
      position: relative;
      width: 100%;
      text-align: left;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 12px;
      padding: 12px 78px 12px 13px;
      font-size: 0.97rem;
      cursor: pointer;
      transition: transform 0.08s ease, border-color 0.18s ease;
    }

    .choice:hover {
      transform: translateY(-1px);
      border-color: #a9cde0;
    }

    .choice.correct {
      border-color: var(--ok-bd);
      background: var(--ok-bg);
      color: var(--ok-tx);
      font-weight: 700;
    }

    .choice.correct::after {
      content: "正解";
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--ok-tx);
      background: #ccf5df;
      border: 1px solid var(--ok-bd);
      border-radius: 999px;
      padding: 4px 8px;
    }

    .choice.wrong {
      border-color: #cfd4dc;
      background: #f3f4f6;
      color: #4b5563;
    }
    .choice.wrong::after {
      content: "不正解";
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.72rem;
      font-weight: 800;
      color: #9f1239;
      background: #ffe7ec;
      border: 1px solid #f4b5c1;
      border-radius: 999px;
      padding: 4px 8px;
    }

    .choice:disabled { cursor: default; }

    .feedback {
      margin-top: 14px;
      padding: 14px;
      border: 1px solid #cfe1f1;
      border-radius: 12px;
      background: #f8fcff;
      display: none;
    }


    .explain-title {
      font-size: 0.86rem;
      letter-spacing: 0.06em;
      color: #31566c;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .explain-body {
      line-height: 1.5;
      font-size: 0.95rem;
      white-space: pre-line;
      padding: 10px 11px;
      border-radius: 10px;
      border: 1px solid #d8e6f0;
      background: #fff;
    }

    .actions {
      margin-top: 12px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .actions.right { justify-content: flex-end; }
    .actions.center { justify-content: center; }

    .btn {
      border: 0;
      border-radius: 11px;
      padding: 11px 16px;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .btn.primary {
      color: #fff;
      background: linear-gradient(to right, var(--r1), var(--r6));
    }

    .btn.primary:hover { filter: brightness(0.95); }

    .btn.ghost {
      background: #eef5fb;
      color: #20465b;
    }

    .center { text-align: center; padding: 28px 8px 8px; }
    .center h2 { margin: 0 0 8px; font-size: 1.45rem; }



    .result-hero {
      margin: 10px auto 0;
      padding: 12px 14px;
      max-width: 520px;
      border-radius: 14px;
      background: #fbfcfe;
      border: 1px solid #d8e6f2;
      text-align: center;
    }

    .result-rate-label {
      margin: 0;
      color: #436178;
      font-size: 0.82rem;
      letter-spacing: 0.06em;
      font-weight: 700;
    }

    .result-rate {
      margin: 4px 0 2px;
      font-size: clamp(1.4rem, 4.5vw, 1.95rem);
      font-weight: 800;
      color: #173f58;
      line-height: 1.1;
    }

    .result-comment {
      margin: 0;
      color: #38546b;
      font-size: 0.92rem;
    }
    .result-head {
      margin: 0 auto 10px;
      width: min(520px, 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .result-head h2 {
      margin: 0;
      font-size: 1.45rem;
    }

    .quiz-header-zone {
      margin-bottom: 10px;
      padding: 0;
    }

    .quiz-body-zone {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .actions.between {
      justify-content: space-between;
    }
    .app.quiz-mode {
      height: calc(100dvh - 40px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .app.quiz-mode .top {
      position: static;
      flex-shrink: 0;
    }

    .app.quiz-mode #quizScreen:not(.hidden) {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      padding: 10px 14px 12px;
      gap: 8px;
    }

    .app.quiz-mode #quizScreen .quiz-header-zone {
      margin-bottom: 0;
      flex-shrink: 0;
    }

    .app.quiz-mode #quizScreen .quiz-body-zone {
      flex: 1;
      min-height: 0;
      padding: 8px;
      gap: 8px;
    }

    .app.quiz-mode #quizScreen .question {
      margin: 0;
      font-size: clamp(0.94rem, 2vw, 1.06rem);
      line-height: 1.4;
    }

    .app.quiz-mode #quizScreen .choices {
      gap: 6px;
    }

    .app.quiz-mode #quizScreen .choice {
      padding: 9px 66px 9px 11px;
      font-size: 0.91rem;
    }

    .app.quiz-mode #quizScreen .feedback {
      margin-top: 0;
      padding: 10px;
      min-height: 0;
      overflow: auto;
    }

    .app.quiz-mode #quizScreen .actions {
      margin-top: 0;
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="app">
    <section class="top">
      <div class="top-intro">
        <h1 class="title">PRIDEクイズチャレンジ</h1>
        <p class="sub">「誰もが自分らしく活躍できる職場・企業」を目指し、LGBTQ+に関する心理的安全性の確保と活躍推進に取り組んでいます。<br>このクイズは、LGBTQ+をはじめとする性的マイノリティへの理解を深める学習コンテンツです。<br>回答後の解説を確認し、要点を振り返りながら学習できます。</p>
      </div>
    </section>

    <section id="startScreen" class="panel center">

      <div class="difficulty-section">
        <p class="difficulty-title">難易度を選択してスタートボタンを押してください。</p>

        <div class="difficulty-grid" role="radiogroup" aria-label="難易度選択">
          <label class="difficulty-option">
            <input
              class="difficulty-radio"
              type="radio"
              name="difficulty"
              value="beginner"
              data-testid="difficulty-beginner-input"
            >
            <span class="difficulty-copy">
              <span class="difficulty-name">初級</span>
              <span class="difficulty-desc">用語や基礎知識を中心に、まず理解を深めたい方向けです。</span>
            </span>
          </label>
          <label class="difficulty-option">
            <input
              class="difficulty-radio"
              type="radio"
              name="difficulty"
              value="standard"
              data-testid="difficulty-standard-input"
            >
            <span class="difficulty-copy">
              <span class="difficulty-name">中級</span>
              <span class="difficulty-desc">職場での配慮やコミュニケーションの実践を学びたい方向けです。</span>
            </span>
          </label>
          <label class="difficulty-option">
            <input
              class="difficulty-radio"
              type="radio"
              name="difficulty"
              value="advanced"
              data-testid="difficulty-advanced-input"
            >
            <span class="difficulty-copy">
              <span class="difficulty-name">上級</span>
              <span class="difficulty-desc">ケース判断や制度理解まで含めて、総合的に確認したい方向けです。</span>
            </span>
          </label>
        </div>
      </div>
      <div class="actions center">
        <button id="startBtn" class="btn primary" data-testid="start-button" disabled>スタート</button>
      </div>
    </section>

    <section id="quizScreen" class="panel hidden">
      <div class="quiz-header-zone">
        <div class="meta">
          <p id="difficultyStatus" class="difficulty-status">-</p>
          <div class="progress-card">
            <div class="progress" aria-label="進捗">
              <div id="progressFill" class="progress-fill"></div>
            </div>
            <div class="progress-label"><span id="qNum">1</span>/<span id="qTotal">10</span></div>
          </div>
        </div>
      </div>

      <div class="quiz-body-zone">
        <h2 id="questionText" class="question"></h2>
        <div id="choices" class="choices"></div>

        <div id="feedback" class="feedback">
          <div class="explain-title">解説</div>
          <div id="explain" class="explain-body"></div>
        </div>

        <div class="actions between">
          <button id="backToStartBtn" class="btn ghost" data-testid="back-to-start-button">開始画面に戻る</button>
          <button id="nextBtn" class="btn ghost hidden" data-testid="next-button">次の問題へ</button>
        </div>
      </div>
    </section>

    <section id="resultScreen" class="panel center hidden">
      <div class="result-head">
        <h2>結果</h2>
        <span id="resultDifficulty" class="difficulty-status">-</span>
      </div>
      <div class="result-hero">
        <p class="result-rate-label">達成率</p>
        <p id="resultRate" class="result-rate">0%</p>
        <p id="resultComment" class="result-comment">-</p>
      </div>
      <div class="actions center">
        <button id="toStartBtn" class="btn ghost" data-testid="to-start-button">最初に戻る</button>
        <button id="retryBtn" class="btn primary" data-testid="retry-button">もう一度挑戦</button>
      </div>
    </section>
  </main>

  <script src="questions-data.js"></script>
  <script>
    let questionSets = window.QUIZ_QUESTION_SETS || null;
    let difficultyLabels = window.QUIZ_DIFFICULTY_LABELS || {
      beginner: "初級",
      standard: "中級",
      advanced: "上級"
    };

    if (!questionSets) {
      throw new Error("問題データの読み込みに失敗しました。questions-data.js を確認してください。");
    }
    const appRoot = document.querySelector(".app");
    const startScreen = document.getElementById("startScreen");
    const quizScreen = document.getElementById("quizScreen");
    const resultScreen = document.getElementById("resultScreen");
    const qNum = document.getElementById("qNum");
    const qTotal = document.getElementById("qTotal");
    const progressFill = document.getElementById("progressFill");
    const questionText = document.getElementById("questionText");
    const choicesEl = document.getElementById("choices");
    const explainEl = document.getElementById("explain");
    const feedbackEl = document.getElementById("feedback");
    const nextBtn = document.getElementById("nextBtn");

    const resultRate = document.getElementById("resultRate");
    const resultComment = document.getElementById("resultComment");
    const resultDifficulty = document.getElementById("resultDifficulty");
    const difficultyStatus = document.getElementById("difficultyStatus");
    const startBtn = document.getElementById("startBtn");
    const retryBtn = document.getElementById("retryBtn");
    const toStartBtn = document.getElementById("toStartBtn");
    const backToStartBtn = document.getElementById("backToStartBtn");
    const difficultyInputs = Array.from(document.querySelectorAll('input[name="difficulty"]'));

    let order = [];
    let current = 0;
    let score = 0;
    let correct = 0;
    let answered = false;
    let currentQuestion = null;
    let selectedDifficulty = "";
    let activeQuestions = [];

    let dataReady = false;
    const defaultTotal = questionSets.standard ? questionSets.standard.length : 10;
    qTotal.textContent = String(defaultTotal);
    startBtn.disabled = true;

    function getSelectedDifficulty() {
      const selected = difficultyInputs.find((input) => input.checked);
      return selected ? selected.value : "";
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function setView(screen) {
      startScreen.classList.add("hidden");
      quizScreen.classList.add("hidden");
      resultScreen.classList.add("hidden");
      screen.classList.remove("hidden");
      appRoot.classList.toggle("quiz-mode", screen === quizScreen);
    }

    function updateStartState() {
      selectedDifficulty = getSelectedDifficulty();
      startBtn.disabled = !dataReady || !selectedDifficulty || !questionSets || !questionSets[selectedDifficulty];
    }

    function setQuestionSource(nextQuestionSets, nextDifficultyLabels) {
      questionSets = nextQuestionSets;
      difficultyLabels = nextDifficultyLabels || difficultyLabels;
      const total = questionSets.standard ? questionSets.standard.length : 10;
      qTotal.textContent = String(total);
      dataReady = true;
      updateStartState();
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let inQuotes = false;
      const input = String(text || "").replace(/^\uFEFF/, "");

      for (let i = 0; i < input.length; i += 1) {
        const char = input[i];
        const next = input[i + 1];

        if (inQuotes) {
          if (char === '"') {
            if (next === '"') {
              cell += '"';
              i += 1;
            } else {
              inQuotes = false;
            }
          } else {
            cell += char;
          }
          continue;
        }

        if (char === '"') {
          inQuotes = true;
          continue;
        }

        if (char === ',') {
          row.push(cell);
          cell = "";
          continue;
        }

        if (char === "\r") {
          if (next === "\n") {
            i += 1;
          }
          row.push(cell);
          rows.push(row);
          row = [];
          cell = "";
          continue;
        }

        if (char === "\n") {
          row.push(cell);
          rows.push(row);
          row = [];
          cell = "";
          continue;
        }

        cell += char;
      }

      if (cell !== "" || row.length > 0) {
        row.push(cell);
        rows.push(row);
      }

      return rows.filter((currentRow) => currentRow.some((value) => String(value || "").trim() !== ""));
    }

    function normalizeText(value) {
      return String(value || "").replace(/\r?\n/g, "\n").trim();
    }

    function rowsToQuestionSets(rows) {
      if (!rows.length) {
        throw new Error("CSV にデータがありません。");
      }

      const headers = rows[0].map((value) => normalizeText(value).toLowerCase());
      const requiredColumns = ["difficulty", "question", "choice1", "choice2", "choice3", "choice4", "answer", "explain"];
      requiredColumns.forEach((column) => {
        if (!headers.includes(column)) {
          throw new Error(`必要な列が見つかりません: ${column}`);
        }
      });

      const indexByName = {};
      headers.forEach((name, index) => {
        indexByName[name] = index;
      });

      const questionSets = {
        beginner: [],
        standard: [],
        advanced: []
      };

      for (let i = 1; i < rows.length; i += 1) {
        const row = rows[i];
        const difficulty = normalizeText(row[indexByName.difficulty]).toLowerCase();
        if (!questionSets[difficulty]) {
          throw new Error(`未対応の difficulty です: ${difficulty}`);
        }

        const question = normalizeText(row[indexByName.question]);
        const choices = [
          normalizeText(row[indexByName.choice1]),
          normalizeText(row[indexByName.choice2]),
          normalizeText(row[indexByName.choice3]),
          normalizeText(row[indexByName.choice4])
        ];
        const answer = Number(normalizeText(row[indexByName.answer]));
        const explain = normalizeText(row[indexByName.explain]);

        if (!question) {
          throw new Error("問題文が空です。");
        }
        if (choices.some((choice) => !choice)) {
          throw new Error(`選択肢が不足しています: ${question}`);
        }
        if (!Number.isInteger(answer) || answer < 0 || answer > 3) {
          throw new Error(`answer は 0 〜 3 の整数で指定してください: ${question}`);
        }
        if (!explain) {
          throw new Error(`解説が空です: ${question}`);
        }

        questionSets[difficulty].push({
          q: question,
          choices,
          answer,
          explain
        });
      }

      Object.keys(questionSets).forEach((difficulty) => {
        if (questionSets[difficulty].length === 0) {
          throw new Error(`difficulty="${difficulty}" の行が 1 件もありません。`);
        }
      });

      return questionSets;
    }

    function updateMeta() {
      qNum.textContent = String(current + 1);
      const ratio = activeQuestions.length > 0 ? ((current + 1) / activeQuestions.length) * 100 : 0;
      progressFill.style.width = `${ratio}%`;
    }

    function lockChoices() {
      choicesEl.querySelectorAll("button").forEach((btn) => {
        btn.disabled = true;
      });
    }

    function showFeedback(isCorrect, explainText) {
      explainEl.textContent = explainText;
      feedbackEl.style.display = "block";
      nextBtn.classList.remove("hidden");
    }

    function onAnswer(selectedIndex) {
      if (answered) return;
      answered = true;

      const data = currentQuestion;
      const buttons = choicesEl.querySelectorAll("button");
      const isCorrect = selectedIndex === data.answerIndex;

      buttons.forEach((btn, i) => {
        if (i === data.answerIndex) btn.classList.add("correct");
        if (i === selectedIndex && !isCorrect) btn.classList.add("wrong");
      });

      if (isCorrect) {
        correct += 1;
        score += 10;
      }

      lockChoices();
      showFeedback(isCorrect, data.explain);
    }

    function renderQuestion() {
      answered = false;
      feedbackEl.style.display = "none";
      nextBtn.classList.add("hidden");

      const base = activeQuestions[order[current]];
      const shuffledChoices = shuffle(
        base.choices.map((text, i) => ({ text, isCorrect: i === base.answer }))
      );

      currentQuestion = {
        q: base.q,
        explain: base.explain,
        choices: shuffledChoices,
        answerIndex: shuffledChoices.findIndex((choice) => choice.isCorrect)
      };

      questionText.textContent = `問題${current + 1} ${currentQuestion.q}`;
      choicesEl.innerHTML = "";

      currentQuestion.choices.forEach((choice, i) => {
        const btn = document.createElement("button");
        btn.className = "choice";
        btn.textContent = `${i + 1}. ${choice.text}`;
        btn.dataset.testid = `choice-button-${i + 1}`;
        btn.addEventListener("click", () => onAnswer(i));
        choicesEl.appendChild(btn);
      });

      updateMeta();
    }

    function commentByRate(rate) {
      if (rate >= 90) return "素晴らしいです。実践的な理解ができています。";
      if (rate >= 70) return "良い結果です。あと少しで上位ランクです。";
      if (rate >= 50) return "基礎は押さえられています。復習でさらに伸ばせます。";
      return "復習してもう一度挑戦してみましょう。";
    }

    function showResult() {
      setView(resultScreen);
      const total = activeQuestions.length;
      const rate = total > 0 ? Math.round((correct / total) * 100) : 0;

      resultRate.textContent = `${rate}%`;
      resultComment.textContent = commentByRate(rate);
      resultDifficulty.textContent = difficultyLabels[selectedDifficulty] || "-";
    }

    function nextQuestion() {
      current += 1;
      if (current >= activeQuestions.length) {
        showResult();
        return;
      }
      renderQuestion();
    }

    function startGame() {
      updateStartState();
      if (!selectedDifficulty || !questionSets[selectedDifficulty]) {
        return;
      }

      activeQuestions = [...questionSets[selectedDifficulty]];
      order = [...Array(activeQuestions.length)].map((_, i) => i);
      if (selectedDifficulty === "beginner") {
        order = shuffle(order);
      }
      current = 0;
      score = 0;
      correct = 0;
      qTotal.textContent = String(activeQuestions.length);
      difficultyStatus.textContent = difficultyLabels[selectedDifficulty];
      setView(quizScreen);
      renderQuestion();
    }

    async function loadDefaultCsv() {
      try {
        const response = await fetch("questions.csv", { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const text = await response.text();
        const rows = parseCsv(text);
        const loaded = rowsToQuestionSets(rows);
        setQuestionSource(loaded, {
          beginner: "初級",
          standard: "中級",
          advanced: "上級"
        });
      } catch (error) {
        dataReady = true;
        updateStartState();
      }
    }

    difficultyInputs.forEach((input) => {
      input.addEventListener("change", updateStartState);
    });
    startBtn.addEventListener("click", startGame);
    retryBtn.addEventListener("click", startGame);
    toStartBtn.addEventListener("click", () => setView(startScreen));
    backToStartBtn.addEventListener("click", () => setView(startScreen));
    nextBtn.addEventListener("click", nextQuestion);

    updateStartState();
    loadDefaultCsv();
  </script>
</body>
</html>
